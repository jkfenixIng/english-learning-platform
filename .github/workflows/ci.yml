name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint --if-present
      - run: npm run typecheck
      - run: npm run build
      - run: npm test --if-present
      - name: Curriculum gates (PRD strict + legacy)
        run: |
          npx tsx scripts/curriculum-verify-images.ts --mode prd_strict
          npx tsx scripts/curriculum-verify-images.ts --mode legacy
          npx tsx scripts/curriculum-audit.ts --mode prd_strict --seed 42
          npx tsx scripts/curriculum-generate.ts --mode prd_strict --seed 42 --out /tmp/prd-a.json
          npx tsx scripts/curriculum-generate.ts --mode prd_strict --seed 42 --out /tmp/prd-b.json
          diff /tmp/prd-a.json /tmp/prd-b.json && echo "[curriculum:idempotency] hash stable"
          npx tsx scripts/migrate-progress.ts --dry-run
